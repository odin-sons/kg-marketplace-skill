name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # SKILL.md links out instead of vendoring the docs (kg-marketplace.pages.dev)
    # by design - this is the check that catches it silently rotting if that
    # site restructures. Weekly, since nothing else here would ever notice.
    - cron: "0 6 * * 1"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress SKILL.md README.md
          fail: true
